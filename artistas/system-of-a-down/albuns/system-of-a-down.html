<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Of A Down</title>
    <style>
        body {
            color: #A6A6A6;
            background-color: #000000;
            font-family: Arial, Helvetica, sans-serif;
        }

        h1,
        .voltar {
            background-color: #353535;
            border: 1px solid #A6A6A6;
            border-radius: 5px;
            padding: 10px;
        }

        a {
            color: #A6A6A6;
            text-decoration: none;
        }

        .foto {
            background-color: #353535;
            border: 1px solid #A6A6A6;
            border-radius: 5px;
            padding: 10px;
        }

        .foto img {
            width: 200px;
            height: 200px;
        }

        .musicas {
            background-color: #353535;
            border: 1px solid #A6A6A6;
            border-radius: 5px;
            padding: 10px;
            margin-top: 20px;
        }

        table {
            border-collapse: collapse;
        }

        caption {
            margin-bottom: 10px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        th,
        td {
            text-align: left;
        }

        button {
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <section class="voltar"> <a href="../../system-of-a-down/system-of-a-down.html">Voltar</a> </section>
    <main>
        <h1>System Of A Down</h1>
        <section class="foto"> <img src="../imagens/System Of A Down.jpg" alt="System Of A Down"> </section>
        <section class="musicas">
            <form>
                <table>
                    <thead>
                        <tr>
                            <th>Música</th>
                            <th>Nota</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td> <label for="suite-pee">Suite-Pee</label> </td>
                            <td> <input id="suite-pee" type="number" min="0" max="10" step="0.5"> </td>
                        </tr>
                        <tr>
                            <td> <label for="know">Know</label> </td>
                            <td> <input id="know" type="number" min="0" max="10" step="0.5"> </td>
                        </tr>
                        <tr>
                            <td> <label for="sugar">Sugar</label> </td>
                            <td> <input id="sugar" type="number" min="0" max="10" step="0.5"> </td>
                        </tr>
                        <tr>
                            <td> <label for="suggestions">Suggestions</label> </td>
                            <td> <input id="suggestions" type="number" min="0" max="10" step="0.5"> </td>
                        </tr>
                        <tr>
                            <td> <label for="spiders">Spiders</label> </td>
                            <td> <input id="spiders" type="number" min="0" max="10" step="0.5"> </td>
                        </tr>
                        <tr>
                            <td> <label for="ddevil">DDevil</label> </td>
                            <td> <input id="ddevil" type="number" min="0" max="10" step="0.5"> </td>
                        </tr>
                        <tr>
                            <td> <label for="soil">Soil</label> </td>
                            <td> <input id="soil" type="number" min="0" max="10" step="0.5"> </td>
                        </tr>
                        <tr>
                            <td> <label for="war">War?</label> </td>
                            <td> <input id="war" type="number" min="0" max="10" step="0.5"> </td>
                        </tr>
                        <tr>
                            <td> <label for="mind">Mind</label> </td>
                            <td> <input id="mind" type="number" min="0" max="10" step="0.5"> </td>
                        </tr>
                        <tr>
                            <td> <label for="peephole">Peephole</label> </td>
                            <td> <input id="peephole" type="number" min="0" max="10" step="0.5"> </td>
                        </tr>
                        <tr>
                            <td> <label for="cuber">CUBErt</label> </td>
                            <td> <input id="cuber" type="number" min="0" max="10" step="0.5"> </td>
                        </tr>
                        <tr>
                            <td> <label for="darts">Darts</label> </td>
                            <td> <input id="darts" type="number" min="0" max="10" step="0.5"> </td>
                        </tr>
                        <tr>
                            <td> <label for="pluck">P.L.U.C.K.</label> </td>
                            <td> <input id="pluck" type="number" min="0" max="10" step="0.5"> </td>
                        </tr>
                    </tbody>
                </table> <button type="submit">Salvar notas</button>
            </form>
        </section>
    </main>
</body>

</html>
