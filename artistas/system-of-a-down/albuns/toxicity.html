<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Of A Down</title>
    <style>
        body {
            color: #A6A6A6;
            background-color: #000000;
            font-family: Arial, Helvetica, sans-serif;
        }

        h1,
        .voltar {
            background-color: #353535;
            border: 1px solid #A6A6A6;
            border-radius: 5px;
            padding: 10px;
        }

        a {
            color: #A6A6A6;
            text-decoration: none;
        }

        .foto {
            background-color: #353535;
            border: 1px solid #A6A6A6;
            border-radius: 5px;
            padding: 10px;
        }

        .foto img {
            width: 200px;
            height: 200px;
        }

        .musicas {
            background-color: #353535;
            border: 1px solid #A6A6A6;
            border-radius: 5px;
            padding: 10px;
            margin-top: 20px;
        }

        table {
            border-collapse: collapse;
        }

        caption {
            margin-bottom: 10px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        th,
        td {
            text-align: left;
        }

        button {
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <section class="voltar"> <a href="../../system-of-a-down/system-of-a-down.html">Voltar</a> </section>
    <main>
        <h1>Toxicity</h1>
        <section class="foto"> <img src="../imagens/Toxicity.jpg" alt="Toxicity"></section>
        <section class="musicas">
            <form action="#" method="post">
                <table>
                    <caption>Notas do álbum System Of A Down (Deluxe)</caption>

                    <thead>
                        <tr>
                            <th>Música</th>
                            <th>Nota</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td><label for="prison-song">Prison Song</label></td>
                            <td><input id="prison-song" name="prison-song" type="number" min="0" max="10" step="0.5"
                                    required></td>
                        </tr>
                        <tr>
                            <td><label for="needles">Needles</label></td>
                            <td><input id="needles" name="needles" type="number" min="0" max="10" step="0.5" required>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="deer-dance">Deer Dance</label></td>
                            <td><input id="deer-dance" name="deer-dance" type="number" min="0" max="10" step="0.5"
                                    required></td>
                        </tr>
                        <tr>
                            <td><label for="jet-pilot">Jet Pilot</label></td>
                            <td><input id="jet-pilot" name="jet-pilot" type="number" min="0" max="10" step="0.5"
                                    required></td>
                        </tr>
                        <tr>
                            <td><label for="x">X</label></td>
                            <td><input id="x" name="x" type="number" min="0" max="10" step="0.5" required></td>
                        </tr>
                        <tr>
                            <td><label for="chop-suey">Chop Suey!</label></td>
                            <td><input id="chop-suey" name="chop-suey" type="number" min="0" max="10" step="0.5"
                                    required></td>
                        </tr>
                        <tr>
                            <td><label for="bounce">Bounce</label></td>
                            <td><input id="bounce" name="bounce" type="number" min="0" max="10" step="0.5" required>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="forest">Forest</label></td>
                            <td><input id="forest" name="forest" type="number" min="0" max="10" step="0.5" required>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="atwa">ATWA</label></td>
                            <td><input id="atwa" name="atwa" type="number" min="0" max="10" step="0.5" required></td>
                        </tr>
                        <tr>
                            <td><label for="science">Science</label></td>
                            <td><input id="science" name="science" type="number" min="0" max="10" step="0.5" required>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="shimmy">Shimmy</label></td>
                            <td><input id="shimmy" name="shimmy" type="number" min="0" max="10" step="0.5" required>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="toxicity">Toxicity</label></td>
                            <td><input id="toxicity" name="toxicity" type="number" min="0" max="10" step="0.5" required>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="psycho">Psycho</label></td>
                            <td><input id="psycho" name="psycho" type="number" min="0" max="10" step="0.5" required>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="aerials">Aerials</label></td>
                            <td><input id="aerials" name="aerials" type="number" min="0" max="10" step="0.5" required>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="arto">Arto</label></td>
                            <td><input id="arto" name="arto" type="number" min="0" max="10" step="0.5" required></td>
                        </tr>
                    </tbody>
                </table>

                <button type="submit">Salvar notas</button>
            </form>
        </section>
    </main>
</body>

</html>
